name: git-tools
version: 0.3.0
description: "Git tools for coding agents: state, commits, rewrites and stacked branches, worktrees and pushing."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - git_commit_amend
  - git_commit_create
  - git_commit_read
  - git_commit_stage
  - git_commit_verify
  - git_grant_create
  - git_grant_read
  - git_grant_revoke
  - git_push_read
  - git_push_send
  - git_rebase_read
  - git_rebase_resume
  - git_rebase_split
  - git_rebase_start
  - git_repo_read
  - git_worktree_add
  - git_worktree_read
  - git_worktree_remove
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  unattended:
    type: bool
    description: "No person can answer: writes run only under a grant that covers them."
  grants_dir:
    type: str
    description: Where grants and their use are kept; default under the user's state directory.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
  emoji:
    type: dict
    description: 'The emoji shown beside each toolset, by toolset name; "" shows none. Merged over the package''s emoji.'
  published_text_rules:
    description: The path (~ allowed, as for every path setting) of a JSON file of published-text rules for the push tools. Unset, nothing is checked.
  worktree_root:
    description: The path where task worktrees go (~ allowed, as for every path setting). Unset, ~/worktrees. The layout is <root>/<repository>/<branch>, with each "/" of the branch written "-".
